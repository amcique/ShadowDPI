name: Build ShadowDPI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'bench/**'
      - 'resources/**'
      - 'third_party/**'
      - 'docs/**'
      - 'tools/**'
      - 'install.ps1'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'NOTICE'
      - 'LICENSE'
      - 'README.md'
      - 'README.ru.md'
      - 'README.tr.md'
      - 'SECURITY.md'
      - 'packaging/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'bench/**'
      - 'resources/**'
      - 'third_party/**'
      - 'docs/**'
      - 'tools/**'
      - 'install.ps1'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'README.md'
      - 'README.ru.md'
      - 'README.tr.md'
      - 'packaging/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# The build job only reads the repository. The release job widens this for the
# step that publishes an archive.
permissions:
  contents: read

# A new push supersedes the previous run for the same ref. Tag runs are never
# cancelled, because they publish a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  WINDIVERT_URL: https://reqrypt.org/download/WinDivert-2.2.0-D.zip
  WINDIVERT_NAME: WinDivert-2.2.0-D.zip
  WINDIVERT_BASENAME: WinDivert-2.2.0-D
  WINDIVERT_SHA256: 1d461cfdfa7ba88ebcfbb3603b71b703e9f72aba8aeff99a75ce293e6f89d2ba

jobs:
  msvc-x64:
    name: MSVC x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Declare short commit variable
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore WinDivert archive
        id: windivert-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.WINDIVERT_NAME }}
          key: ${{ env.WINDIVERT_SHA256 }}

      - name: Download WinDivert
        if: steps.windivert-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WINDIVERT_URL -OutFile $env:WINDIVERT_NAME
          $hash = (Get-FileHash $env:WINDIVERT_NAME -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINDIVERT_SHA256) {
            throw "WinDivert checksum mismatch: $hash"
          }

      - name: Extract WinDivert
        shell: pwsh
        run: Expand-Archive -Path $env:WINDIVERT_NAME -DestinationPath . -Force

      - name: Configure
        shell: pwsh
        run: |
          $env:WINDIVERT_ROOT = Join-Path $env:GITHUB_WORKSPACE $env:WINDIVERT_BASENAME
          cmake --preset msvc-x64 `
            -DSHADOWDPI_WARNINGS_AS_ERRORS=ON `
            -DSHADOWDPI_REQUIRE_WINDIVERT_RUNTIME=ON

      - name: Build
        run: cmake --build --preset msvc-x64-release

      - name: Test
        run: ctest --preset msvc-x64-release

      - name: Build Debug
        run: cmake --build --preset msvc-x64-debug

      - name: Test Debug
        run: ctest --preset msvc-x64-debug --output-on-failure

      - name: Installer checks
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content install.ps1 -Raw))
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.7.1
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path tests/installer -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failed tests"
          }

      - name: Validate packaging manifests
        shell: pwsh
        run: |
          $null = Get-Content packaging/scoop/shadowdpi.json -Raw | ConvertFrom-Json

      # CTest hides output of passing tests; run the benchmark once more so the
      # timings are visible in the build log.
      - name: Parser benchmark
        run: .\build\msvc-x64\Release\shadowdpi_parse_bench.exe --check

      - name: Prepare x64 directory
        shell: pwsh
        run: |
          $dir = "shadowdpi_x64_${{ steps.vars.outputs.sha_short }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item build/msvc-x64/Release/shadowdpi.exe $dir
          Copy-Item build/msvc-x64/Release/WinDivert.dll $dir
          Copy-Item build/msvc-x64/Release/WinDivert64.sys $dir
          Get-Content release-files.txt | Where-Object { $_.Trim() -and -not $_.StartsWith('#') } | ForEach-Object {
            $entry = $_.Trim().TrimEnd('/')
            if (Test-Path -LiteralPath $entry) {
              Copy-Item -LiteralPath $entry -Destination $dir -Recurse -Force
            }
          }
          $thirdParty = Join-Path $dir 'third_party/WinDivert'
          New-Item -ItemType Directory -Path $thirdParty | Out-Null
          Copy-Item third_party/WinDivert/LICENSE $thirdParty
          Copy-Item third_party/WinDivert/README.md $thirdParty

      - name: Upload output file x64
        uses: actions/upload-artifact@v7
        with:
          name: shadowdpi_x64_${{ steps.vars.outputs.sha_short }}
          path: shadowdpi_x64_${{ steps.vars.outputs.sha_short }}

  release:
    name: GitHub Release
    needs: msvc-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          pattern: shadowdpi_x64_*
          path: release
          merge-multiple: true

      - name: Package archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "shadowdpi-${version}-x64"
          cp -R release/. "shadowdpi-${version}-x64/"
          ( cd "shadowdpi-${version}-x64" && find . -type f -print0 | sort -z | xargs -0 sha256sum ) > "shadowdpi-${version}-x64.sha256"
          zip -qr "shadowdpi-${version}-x64.zip" "shadowdpi-${version}-x64"
          sha256sum "shadowdpi-${version}-x64.zip" >> "shadowdpi-${version}-x64.sha256"
          cat > release-body.md <<EOF
          Windows x64. Unpack \`shadowdpi-${version}-x64.zip\` and run
          \`install.ps1\` from an elevated PowerShell, or run
          \`shadowdpi.exe\` directly to try it without installing.

          ### Verify the download

          \`\`\`powershell
          Get-FileHash .\shadowdpi-${version}-x64.zip -Algorithm SHA256
          gh attestation verify .\shadowdpi-${version}-x64.zip --repo ${{ github.repository }}
          \`\`\`

          Compare the hash with the matching line in
          \`shadowdpi-${version}-x64.sha256\`. The same file lists a hash for
          every file inside the archive.

          ### Notes

          - Full commit history for this tag: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          - ShadowDPI needs Administrator rights and loads the WinDivert kernel driver.
          - The executable is not Authenticode-signed, so SmartScreen and some
            antivirus engines may warn. Verify the hash or build from source.
          - Report vulnerabilities through [SECURITY.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/SECURITY.md), not a public issue.
          EOF

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        # Attestations need a public repository, or GitHub Enterprise Cloud. The
        # repository is public, so a release without an attestation would break
        # the verification steps in SECURITY.md and the release body. Let this
        # step fail the job instead of publishing an unverifiable archive.
        with:
          subject-path: shadowdpi-*-x64.zip

      - name: Create GitHub release
        # Pinned to v3.0.4. This is the only third-party action in the workflow
        # that holds a write token, and the release body is written in full
        # below, so generated notes are not added.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          name: ShadowDPI ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            shadowdpi-*.zip
            shadowdpi-*.sha256
